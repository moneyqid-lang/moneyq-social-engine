name: MoneyQ Social Media Scheduler

on:
  schedule:
    # Run every 4 hours at staggered times (WIB-aligned)
    # 00:30 WIB = 17:30 UTC (previous day)
    - cron: '30 17 * * *'   # 00:30 WIB
    # 04:30 WIB = 21:30 UTC (previous day)
    - cron: '30 21 * * *'   # 04:30 WIB
    # 08:30 WIB = 01:30 UTC
    - cron: '30 1 * * *'    # 08:30 WIB
    # 12:30 WIB = 05:30 UTC
    - cron: '30 5 * * *'    # 12:30 WIB
    # 16:30 WIB = 09:30 UTC
    - cron: '30 9 * * *'    # 16:30 WIB
    # 20:30 WIB = 13:30 UTC
    - cron: '30 13 * * *'   # 20:30 WIB
  workflow_dispatch:  # Manual trigger for testing

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Social Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MONEYQ_URL: ${{ secrets.MONEYQ_URL }}
        run: node src/orchestrator.js

      - name: Archive output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-output-${{ github.run_id }}
          path: output/
          retention-days: 7

      - name: Health check on failure
        if: failure()
        run: node src/index.js health
