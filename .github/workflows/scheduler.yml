name: MoneyQ Social Media Scheduler

on:
  schedule:
    # ============================================================
    # Instagram + Threads (7x/hari)
    # ============================================================
    - cron: '0 0 * * *'    # 07:00 WIB
    - cron: '0 3 * * *'    # 10:00 WIB
    - cron: '15 5 * * *'   # 12:15 WIB
    - cron: '0 7 * * *'    # 14:00 WIB
    - cron: '0 11 * * *'   # 18:00 WIB
    - cron: '0 12 * * *'   # 19:00 WIB
    - cron: '0 13 * * *'   # 20:00 WIB
    # ============================================================
    # YouTube Shorts (2x/hari)
    # ============================================================
    - cron: '0 4 * * *'    # 11:00 WIB
    - cron: '0 10 * * *'   # 17:00 WIB
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to publish (comma-separated)'
        required: false
        default: 'auto'
        type: string

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout moneyq-social-engine
        uses: actions/checkout@v4
        with:
          path: moneyq-social-engine

      - name: Checkout moneyq-video-templates
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moneyq-video-templates
          token: ${{ secrets.GITHUB_TOKEN }}
          path: moneyq-video-templates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            moneyq-social-engine/package-lock.json
            moneyq-video-templates/package-lock.json

      - name: Install dependencies (social-engine)
        working-directory: moneyq-social-engine
        run: npm ci

      - name: Install dependencies (video-templates)
        working-directory: moneyq-video-templates
        run: npm ci

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Determine target platforms
        id: platforms
        run: |
          MANUAL="${{ github.event.inputs.platforms }}"

          if [ "$MANUAL" != "auto" ] && [ -n "$MANUAL" ]; then
            echo "platforms=$MANUAL" >> $GITHUB_OUTPUT
            echo "📋 Manual override: $MANUAL"
            exit 0
          fi

          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          CURRENT_UTC="${HOUR}:${MIN}"

          # YouTube: 04:00 UTC (11 WIB) atau 10:00 UTC (17 WIB)
          if [ "$HOUR" = "04" ] || [ "$HOUR" = "10" ]; then
            # Jam 10:00 UTC = YouTube only (17 WIB)
            # Jam 04:00 UTC = YouTube only (11 WIB)
            echo "platforms=youtube" >> $GITHUB_OUTPUT
            echo "📋 YouTube slot (UTC $CURRENT_UTC)"
          else
            # Semua jam lain = Instagram + Threads
            echo "platforms=instagram,threads" >> $GITHUB_OUTPUT
            echo "📋 IG+Threads slot (UTC $CURRENT_UTC)"
          fi

      - name: Run Social Engine
        working-directory: moneyq-social-engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MONEYQ_URL: ${{ secrets.MONEYQ_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          PLATFORMS="${{ steps.platforms.outputs.platforms }}"
          echo "🚀 Publishing to: $PLATFORMS"
          node src/orchestrator.js $PLATFORMS

      - name: Archive output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-output-${{ github.run_id }}
          path: moneyq-social-engine/output/
          retention-days: 7

      - name: Health check on failure
        if: failure()
        working-directory: moneyq-social-engine
        run: node src/index.js health
